<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資料確認</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      background-color: #f6f7f9;
      color: #333;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: 0 auto;
    }
    h2 {
      font-size: 1.2rem;
      margin-top: 0;
    }
    .pdf-container {
      margin: 15px 0;
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #06C755;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #message {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>会議資料の確認</h2>
  <p id="user-info">ユーザー情報を取得中...</p>
  
  <div class="pdf-container">
    <iframe src="sample.pdf"></iframe>
  </div>

  <button id="confirm-btn" class="btn" onclick="confirmMaterial()" disabled>確認しました</button>
  <p id="message"></p>
</div>

<script>
  // ★ご自身の環境に合わせて設定してください★
  const LIFF_ID = "2007050017-ZJd5180g"; 
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyfD0-jH6_WjB8m7wE_aE9jJ4d91N4e402kX/exec"; // GASのWebアプリURL
  const AGENDA_NAME = "第1回 役員会資料";

  let userName = "";

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      const profile = await liff.getProfile();
      userName = profile.displayName;
      document.getElementById("user-info").textContent = `ログイン中: ${userName} 様`;
      document.getElementById("confirm-btn").disabled = false;
    } catch (err) {
      console.error(err);
      document.getElementById("user-info").textContent = "ユーザー情報の取得に失敗しました。";
    }
  }

  async function confirmMaterial() {
    if (!userName) {
      alert("ユーザー情報が取得できていません。");
      return;
    }

    const btn = document.getElementById("confirm-btn");
    btn.disabled = true;
    document.getElementById("message").textContent = "送信中...";

    const payload = {
      name: userName,
      agenda: AGENDA_NAME
    };

    try {
      // no-cors モードで GAS へ送信（CORSエラーを回避）
      await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      
      // 送信成功時の表示更新
      document.getElementById("message").textContent = "確認状況を記録しました。";
      btn.textContent = "確認済み";
      
    } catch (err) {
      document.getElementById("message").textContent = "通信エラーが発生しました。";
      btn.disabled = false;
    }
  }

  main();
</script>

</body>
</html>
